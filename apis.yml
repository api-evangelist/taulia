apis:
- name: Taulia Buyer API
  description: >-
    The buyer-side integration API described in the SAP Taulia Description of Software Services.
    It carries the accounts-payable object set — supplier master, business unit, purchase orders,
    invoices, payments and early payment requests — between a customer's ERP and the Taulia
    Platform. Authentication for the SAP S/4HANA Cloud Public Edition path is an OIDC JWT-bearer
    trust with the audience extapi-buyer-integration, registered in Taulia under Settings >
    Integrations > Setup Token.
  humanURL: https://taulia.com/dss/
  tags:
  - Accounts Payable
  - Supply Chain Finance
  - ERP Integration
  properties:
  - type: Documentation
    url: https://taulia.com/dss/
  - type: GettingStarted
    url: https://support.taulia.com/article/Easy-Guide-to-Activating-SAP-Taulia-with-S-4HANA-Cloud-Public-Edition
  - type: Authentication
    url: authentication/taulia-authentication.yml
  x-base-url: >-
    NOT PUBLISHED. No SAP Taulia page states a base URL for this API. api.taulia.com resolves in
    DNS to a Taulia-controlled AWS ELB named soapelbg-599781985.us-east-1.elb.amazonaws.com but
    drops the TLS handshake for anonymous clients, so it could not be confirmed as this API's host.
    Recording the absence rather than guessing the base from the domain.
- name: Taulia Supplier API
  description: >-
    The supplier-side integration API described in the SAP Taulia Description of Software Services.
    It exchanges information between the Taulia Platform and a supplier's accounts-receivable data:
    submitting invoices, checking invoice status, and receiving or confirming purchase orders.
    Documented as RESTful with resource-oriented URLs, JSON request and response bodies, HTTP verbs
    and HTTP status codes for errors, authenticated with an assigned API key.
  humanURL: https://taulia.com/dss/
  tags:
  - Accounts Receivable
  - Invoicing
  - Supplier Management
  properties:
  - type: Documentation
    url: https://taulia.com/dss/
  - type: Authentication
    url: authentication/taulia-authentication.yml
  x-base-url: >-
    NOT PUBLISHED. Same finding as the Buyer API — no base URL is stated in any public SAP Taulia
    document.
