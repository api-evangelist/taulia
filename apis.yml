aid: taulia
name: Taulia
description: >-
  SAP Taulia is a working-capital and cash-flow acceleration platform for enterprises, their
  suppliers and their funding partners. Acquired by SAP in 2022 and now operated as SAP Taulia, it
  runs supply chain finance, dynamic discounting, ERP-embedded virtual cards, receivables finance,
  inventory finance, supplier self-service and supplier information management across SAP and
  non-SAP ERP estates. Its programmatic surface is an enterprise integration estate rather than a
  public developer platform: a Taulia Buyer API and Taulia Supplier API described in the
  Description of Software Services, an XMLRPC interface monitored per region on the public status
  page, a Taulia Connector supporting SFTP, AS2 and HTTP with EDI, cXML and XML payloads, and ERP
  add-ons for SAP, SAP Integration Suite managed gateway and Oracle EBS. No OpenAPI, AsyncAPI,
  GraphQL SDL, WSDL, Postman collection or SDK is published anywhere, and API credentials are
  provisioned during onboarding rather than through self-service.
