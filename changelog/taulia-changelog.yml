- version: Taulia Add-on for SAP Integration Suite, Managed Gateway SP07
  date: '2026-05-15'
  url: https://support.taulia.com/article/Taulia-Add-on-for-SAP-integration-suite-managed-gateway-SP07-Release-Notes
  support_period: '2026-05-15 to 2028-05-15'
  breaking: false
  highlights:
  - Pay Before Maturity for Virtual Card programs, with a new VC_EP_PAYMENT_TERM global parameter.
  - >-
    Taulia Connector Activity Monitor (t-code TAUCIG_CONNECTOR) — a dashboard over every
    integration process, with message statuses, logs and XML payload inspection.
  - Credit Note Netting support for Virtual Card early payment requests, including cancellation.
  - >-
    Two new REST message headers on every send process, x-tau-integration-source and
    x-tau-integration-source-version, identifying the add-on and its support-pack level.
  - >-
    Receivables partial payments and partial payment reversals now auto-queue a retransfer so
    invoice status is corrected on the Taulia Platform.
  - DigiCert certificate transition from G1 to G5 on the Managed Gateway platform.
  fixes:
  - Dynamic Discounting compliance credit note posting on multi-GL-line and multi-tax-line invoices.
  - Early Payment Request discount days/percentage/amount not updating on some SAP versions.
  - >-
    Reversal of a Dynamic Discounting compliance credit note posted in a closed period during
    Early Payment Cancel.
  note: >-
    This release note also changes the parameters of method DURING_UPDATE in the
    TAUCIG_WC_INVOICE_UPDATE BAdI — a breaking change for customers who enhanced that method.
