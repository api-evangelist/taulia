domain_standards:
  note: >-
    REWARD-ONLY and DELIBERATELY NOT CLAIMED. Procure-to-pay and supply-chain finance do have
    domain standards, and SAP Taulia's own Description of Software Services names several of them
    as supported interchange formats. But domain-standard conformance is a property of a
    CONTRACT, and SAP Taulia publishes none — there is no cXML message, no EDI transaction set, no
    ISO 20022 message type and no AS2 endpoint anywhere in a machine-readable artifact we can
    point at. These are therefore recorded as vendor claims awaiting a contract, not as
    conformance.
  claimed:
  - standard: cXML
    claimed_in: https://taulia.com/dss/
    contract_evidence: none
  - standard: EDI (flat-file interchange)
    claimed_in: https://taulia.com/dss/
    contract_evidence: none
  - standard: AS2 (RFC 4130) transport
    claimed_in: https://taulia.com/dss/
    contract_evidence: none
  - standard: XML-RPC
    claimed_in: https://status.taulia.com/
    contract_evidence: none
    note: >-
      XMLRPC is a named, per-region monitored component on the SAP Taulia status page. That is
      operational evidence the interface exists and is load-bearing; it is not a contract.
