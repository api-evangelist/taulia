  conforms: true
  evidence: >-
    https://support.taulia.com/article/Easy-Guide-to-Activating-SAP-Taulia-with-S-4HANA-Cloud-Public-Edition
    documents an OAuth/OIDC JWT-bearer trust with audience extapi-buyer-integration, an IAS issuer,
    and a provider JWKS URL registered in Taulia under Settings > Integrations > Setup Token.
  evidence_type: docs-prose
- id: oidc
  conforms: true
  evidence: >-
    The same activation guide requires an OpenID Connect application in SAP Cloud Identity
