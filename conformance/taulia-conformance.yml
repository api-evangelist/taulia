note: >-
  NO MACHINE-READABLE CONTRACT EXISTS for SAP Taulia, so every row below is evidenced from the
  provider's own prose (Description of Software Services, Commitment to Security, Agreements) and
  from live probes — never from a spec. Rows that a contract would normally prove are marked
  conforms:false with the reason, rather than credited from marketing copy.
standards:
