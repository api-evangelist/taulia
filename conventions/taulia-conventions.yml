  than inferred from a peer API.
auth_style:
  documented: true
  summary: >-
    OAuth 2.0 / OIDC JWT-bearer trust (audience extapi-buyer-integration, issuer a customer SAP
    IAS tenant) for the buyer integration; assigned API key for direct Buyer/Supplier API
    integration. Full detail in authentication/taulia-authentication.yml.
  see: authentication/taulia-authentication.yml
idempotency:
  supported: unknown
  documented: false
  header: null
  scope: null
  retention: null
  note: >-
    No idempotency key, no retry-safety statement, and no de-duplication convention appears
    anywhere on the public surface. The SP07 release notes do describe an acknowledgment protocol
    on the ERP-add-on side — every send process carries a message acknowledgment ID, and the
    Taulia Data Cleanup program resets the ERP Batch ID for objects unacknowledged after 12 hours
    so they are automatically reprocessed — which is at-least-once delivery with reprocessing, not
    a caller-supplied idempotency key. No Idempotency pointer is emitted.
