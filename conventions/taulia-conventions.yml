reversibility:
  grade: documented
  applicable: true
  note: >-
    SAP Taulia's write surface is genuinely reversible and the reversal is a first-class,
    separately monitored integration process — but no reversal WINDOW is stated anywhere, which is
    what keeps this at `documented` rather than `verified`. Never assert a window SAP Taulia has
    not published; for an early-payment platform an invented window would be a claim about
    someone's cash.
  write_surfaces:
  - operation: Early Payment Request
    reversal: Early Payment Cancellation Request
    operation_id: null
    window: null
    mechanism: >-
      The Taulia Platform sends an Early Payment Cancellation Request to the ERP add-on, which
      restores the original baseline date, payment terms details and payment method on the related
      document(s) from the values captured in the Taulia register table. For Virtual Card
      pay-before-maturity and for credit-note-netted positions, every document in the netted
      position is returned to its pre-request state.
    source: >-
      https://support.taulia.com/article/Taulia-Add-on-for-SAP-integration-suite-managed-gateway-SP07-Release-Notes
  - operation: Dynamic Discounting compliance credit note posting
    reversal: Credit note reversal during Early Payment Cancel
    operation_id: null
    window: null
    mechanism: >-
      On cancellation the compliance credit note is reversed. If the original posting period is
      closed, the closed-period reversal reason is used and the cancellation request's own date
      becomes the posting date, so the cancellation still processes automatically. This is a
      documented behaviour of the reversal path, not a stated time limit on it.
    source: >-
      https://support.taulia.com/article/Taulia-Add-on-for-SAP-integration-suite-managed-gateway-SP07-Release-Notes
  - operation: Early Payment Request (netted position, any document fails)
    reversal: automatic all-or-nothing revert
    operation_id: null
    window: null
    mechanism: >-
      "An error in processing any of the documents in the netted position will result in reverting
      changes to all documents and a rejection will be sent to the Taulia Platform."
    source: >-
      https://support.taulia.com/article/Taulia-Add-on-for-SAP-integration-suite-managed-gateway-SP07-Release-Notes
  missing_for_verified:
  - >-
    No published deadline for cancelling an early payment request — the practical bound is implied
    by the payment run and, for Virtual Cards, by maturity, but SAP Taulia states neither as a
    window.
